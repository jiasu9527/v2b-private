# port: 7890
# socks-port: 7891
# redir-port: 7892
# tproxy-port: 7893
mixed-port: 7890
allow-lan: true
bind-address: "*"
mode: rule
log-level: info
external-controller: 127.0.0.1:9090

dns:
  enable: true
  # listen: 0.0.0.0:53
  ipv6: false
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  use-hosts: true
  respect-rules: true
  default-nameserver:
    - 223.5.5.5
    - 119.29.29.29
    - 114.114.114.114
  proxy-server-nameserver:
    - 223.5.5.5
    - 119.29.29.29
    - 114.114.114.114
  nameserver:
    - 223.5.5.5
    - 119.29.29.29
    - 114.114.114.114
  nameserver-policy:
    '+.apt-hcloud.dev':
      - https://38.207.164.191:8080/dns-query


proxies:

proxy-groups:
  - { name: "节点选择", type: select, proxies: ["自动选择"] }
  - { name: "自动选择", type: url-test, proxies: [], url: "http://www.google-analytics.com/generate_204", interval: 300, tolerance: 50 }
  - { name: "AI服务", type: select, proxies: ["节点选择","自动选择"] }
  - { name: "流媒体", type: select, proxies: ["节点选择","自动选择"] }
  - { name: "国际服务", type: select, proxies: ["节点选择","自动选择"] }
  - { name: "全球直连", type: select, proxies: ["DIRECT","节点选择",/禁止/] }
  - { name: "广告拦截", type: select, proxies: ["REJECT","DIRECT",/禁止/] }
  - { name: "应用净化", type: select, proxies: ["REJECT","DIRECT",/禁止/] }

